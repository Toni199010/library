name: download-libs-windows
on: [workflow_dispatch]
jobs:
  python-libs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.2"

      - name: Add the Windows-only package
        shell: pwsh
        run: Add-Content backend/requirements.txt "`npython-magic-bin==0.4.14"

      - name: Build wheelhouse
        shell: pwsh
        run: |
          python --version
          python -m pip install --upgrade pip setuptools wheel
          python -m pip wheel --wheel-dir backend/wheelhouse pip setuptools wheel -r backend/requirements.txt

      - name: Test offline install
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP\v"
          & "$env:RUNNER_TEMP\v\Scripts\pip.exe" install --no-index --find-links backend/wheelhouse -r backend/requirements.txt

      - uses: actions/upload-artifact@v4
        with:
          name: python-libs-windows
          path: |
            backend/wheelhouse
            backend/requirements.txt
          retention-days: 7
